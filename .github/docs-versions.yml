# Versions exposed on the PyRIT documentation site.
#
# This file is the single source of truth consumed by:
#   * .github/workflows/docs.yml   - builds each version listed below
#   * the version picker injected into every doc page
#   * doc/contributing/10_release_process.md - tells the releaser to edit this file
#
# To add a new release version: insert an entry at the top of `versions:`, immediately
# after `latest`, and update `default:` / `stable:` if the new release should become the
# landing page. The picker renders this list in file order, so the newest release goes first.

default: "1.1.0"  # served at the site root (microsoft.github.io/PyRIT/)
stable: "1.1.0"   # served at /stable/ and shown as "(stable)" in the picker

versions:
  - slug: latest
    name: "latest (dev, main)"
    ref: main
  - slug: "1.1.0"
    name: "1.1.0"
    ref: releases/v1.1.0
  - slug: "1.0.1"
    name: "1.0.1"
    ref: releases/v1.0.1
  - slug: "0.14.0"
    name: "0.14.0"
    ref: releases/v0.14.0
  - slug: "0.13.0"
    name: "0.13.0"
    ref: releases/v0.13.0
  - slug: "0.12.1"
    name: "0.12.1"
    ref: releases/v0.12.1
