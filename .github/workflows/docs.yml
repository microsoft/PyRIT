name: build-book

on:
  push:
    branches:
      - main
      - "releases/v*"
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - "releases/**"
    paths:
      - ".github/workflows/docs.yml"
      - ".github/docs-versions.yml"
      - "build_scripts/inject_version_picker.py"
      - "build_scripts/version_picker_assets/**"
      - "doc/**"
      - "build_scripts/pydoc2json.py"
      - "build_scripts/gen_api_md.py"
      - "pyrit/**"
  workflow_dispatch:

# Permissions for the GH Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # All versioned URLs live under /<repo-name>/<slug>/, e.g. /PyRIT/0.13.0/.
  DOCS_BASE: /${{ github.event.repository.name }}

jobs:
  # ------------------------------------------------------------------
  # 1. Read .github/docs-versions.yml and turn it into a build matrix.
  # ------------------------------------------------------------------
  versions:
    name: Resolve version matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      default: ${{ steps.matrix.outputs.default }}
      stable: ${{ steps.matrix.outputs.stable }}
      versions_json: ${{ steps.matrix.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/docs-versions.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install --quiet "pyyaml>=6.0"

      - name: Compute matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import yaml

          with open(".github/docs-versions.yml") as f:
              cfg = yaml.safe_load(f)

          versions = cfg["versions"]
          matrix = {"include": [{"slug": v["slug"], "ref": v["ref"]} for v in versions]}
          versions_json = {
              "default": cfg["default"],
              "stable": cfg["stable"],
              "versions": versions,
          }

          print("matrix=" + json.dumps(matrix))
          print("default=" + cfg["default"])
          print("stable=" + cfg["stable"])
          print("versions_json=" + json.dumps(versions_json))
          PY

  # ------------------------------------------------------------------
  # 2. Build each version in parallel.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.slug }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.versions.outputs.matrix) }}
    env:
      BASE_URL: ${{ format('/{0}/{1}', github.event.repository.name, matrix.slug) }}
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install PyRIT with dev dependencies
        # Use `uv sync --frozen` so each release branch installs the exact
        # versions pinned in its own uv.lock. Frozen branch = frozen deps =
        # bit-for-bit reproducible rebuild forever. Newer release branches
        # (incl. main) use PEP 735 [dependency-groups]; older releases use
        # legacy [project.optional-dependencies] -- try the group syntax
        # first, fall back to the extra.
        run: |
          uv sync --frozen --group dev 2>/dev/null || uv sync --frozen --extra dev

      - name: Generate API reference (pydoc2json + gen_api_md)
        run: |
          source .venv/bin/activate
          python build_scripts/pydoc2json.py pyrit --submodules -o doc/_api/pyrit_all.json
          python build_scripts/gen_api_md.py

      - name: Build the static HTML site
        # --all builds frontmatter exports (PDF, per doc/myst.yml).
        # --html is required to produce the static HTML site we deploy.
        # NOT using --strict because older release branches have known
        # warnings (e.g. unresolved cross-refs) that aren't worth fixing
        # retroactively just to satisfy strict mode.
        working-directory: doc
        run: |
          source ../.venv/bin/activate
          jupyter-book build --all --html

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.slug }}
          path: doc/_build/html
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. Compose dist/, inject picker, deploy to GH Pages.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [versions, build]
    runs-on: ubuntu-latest
    # Deploy on push to main, or when triggered manually from main. Skipped
    # for pushes to release branches (those builds are validation-only) and
    # for pull requests.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            build_scripts/inject_version_picker.py
            build_scripts/version_picker_assets
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: site-*

      - name: Compose dist/
        env:
          DEFAULT_SLUG: ${{ needs.versions.outputs.default }}
          STABLE_SLUG: ${{ needs.versions.outputs.stable }}
          VERSIONS_JSON: ${{ needs.versions.outputs.versions_json }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Each artifact lands at artifacts/site-<slug>/. Move to dist/<slug>/.
          for d in artifacts/site-*; do
            slug="${d#artifacts/site-}"
            echo "::group::Stage $slug"
            mkdir -p "dist/$slug"
            cp -r "$d/." "dist/$slug/"
            echo "::endgroup::"
          done

          # Write the version manifest at the root.
          echo "$VERSIONS_JSON" > dist/versions.json

          # Root redirect: /PyRIT/ -> /PyRIT/<default>/
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PyRIT Documentation</title>
            <meta http-equiv="refresh" content="0; url=${DOCS_BASE}/${DEFAULT_SLUG}/">
            <link rel="canonical" href="${DOCS_BASE}/${DEFAULT_SLUG}/">
          </head>
          <body>
            <p>Redirecting to <a href="${DOCS_BASE}/${DEFAULT_SLUG}/">PyRIT documentation (${DEFAULT_SLUG})</a>.</p>
          </body>
          </html>
          EOF

          # Stable alias: /PyRIT/stable/ -> /PyRIT/<stable>/
          mkdir -p dist/stable
          cat > dist/stable/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PyRIT Documentation (stable)</title>
            <meta http-equiv="refresh" content="0; url=${DOCS_BASE}/${STABLE_SLUG}/">
            <link rel="canonical" href="${DOCS_BASE}/${STABLE_SLUG}/">
          </head>
          <body>
            <p>Redirecting to <a href="${DOCS_BASE}/${STABLE_SLUG}/">PyRIT documentation (${STABLE_SLUG}, stable)</a>.</p>
          </body>
          </html>
          EOF

          # Custom 404 page served by GitHub Pages for any unmatched path
          # under /PyRIT/. Two-stage UX:
          #
          #   1. Auto-redirect: parse the URL, walk up ancestor paths within
          #      the same version, HEAD-test each, and redirect to the deepest
          #      one that exists (so /code/gui/some/view -> /code/gui/some,
          #      then /code/gui, etc.). Only redirects if a non-root ancestor
          #      matches, so we don't yank users to the home page silently.
          #   2. If nothing better than the version root exists, render a
          #      friendly fallback page with the version picker (injected by
          #      the next step) so the user can switch versions.
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Page not found - PyRIT Documentation</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #0f172a; line-height: 1.55; }
              h1 { font-size: 2rem; margin: 0 0 0.5rem; }
              .muted { color: #64748b; }
              code { background: #f1f5f9; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
              .btn { display: inline-block; padding: 0.6rem 1.1rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 0.5rem; margin-top: 1.5rem; font-weight: 500; }
              .btn:hover { background: #1d4ed8; }
              @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } code { background: #1e293b; color: #f8fafc; } .muted { color: #94a3b8; } }
            </style>
            <script>
            (function () {
              // Extract the docs base + version slug + relative path from the URL.
              // URL shape: /<docs-base>/<slug>/<rest>
              var meta = document.querySelector('meta[name="pyrit-docs-base"]');
              var docsBase = (meta && meta.content) ? meta.content.replace(/\/$/, "") : "";
              if (!docsBase) {
                // Fall back to first path segment if injector hasn't run.
                var parts = window.location.pathname.split("/").filter(Boolean);
                docsBase = parts.length > 0 ? "/" + parts[0] : "";
              }
              var path = window.location.pathname;
              if (!path.startsWith(docsBase + "/")) return; // not our base
              var rest = path.slice(docsBase.length + 1);
              var slash = rest.indexOf("/");
              var slug = slash === -1 ? rest : rest.slice(0, slash);
              if (!slug) return;
              var relPath = slash === -1 ? "" : rest.slice(slash + 1);
              if (!relPath) return; // already at version root

              // Generate ancestor paths most-specific-first.
              var clean = relPath.replace(/\/+$/, "");
              var segs = clean.split("/").filter(Boolean);
              var paths = [];
              // Start at length-1 (skip the full path, which we already know
              // is the 404 we're rendering). Walk down to depth 1 (no root).
              for (var i = segs.length - 1; i > 0; i--) {
                paths.push(segs.slice(0, i).join("/") + "/");
              }
              if (paths.length === 0) return; // nothing to climb

              var versionBase = docsBase + "/" + slug + "/";
              // Probe `<path>index.html` not `<path>/`: GH Pages 404s a dir
              // without an index, but the redirect target should be a real
              // rendered page, not a parent dir.
              var results = new Array(paths.length);
              var pending = paths.length;
              paths.forEach(function (p, idx) {
                fetch(versionBase + p + "index.html", { method: "HEAD", cache: "no-cache" })
                  .then(function (r) { results[idx] = r.ok; })
                  .catch(function () { results[idx] = false; })
                  .then(function () {
                    pending--;
                    if (pending === 0) {
                      for (var j = 0; j < results.length; j++) {
                        if (results[j]) {
                          window.location.replace(versionBase + paths[j]);
                          return;
                        }
                      }
                      // No ancestor exists. Leave the static fallback page up.
                    }
                  });
              });
            })();
            </script>
          </head>
          <body>
            <h1>Page not found</h1>
            <p class="muted">The page you requested doesn't exist in this version of the PyRIT docs.</p>
            <p>We tried looking for the closest parent section that exists, but didn't find one. The version picker in the bottom-right corner shows what's available across all versions.</p>
            <p><a class="btn" href="DOCS_BASE_PLACEHOLDER/DEFAULT_SLUG_PLACEHOLDER/">Go to PyRIT DEFAULT_SLUG_PLACEHOLDER home</a></p>
            <p class="muted" style="margin-top: 3rem; font-size: 0.85rem;">Requested URL: <code id="requested-url"></code></p>
            <script>document.getElementById("requested-url").textContent = window.location.pathname + window.location.search;</script>
          </body>
          </html>
          EOF
          # Substitute placeholders so we can use a single-quoted heredoc (which
          # disables shell expansion) above, keeping the inline JS readable.
          sed -i "s|DOCS_BASE_PLACEHOLDER|${DOCS_BASE}|g; s|DEFAULT_SLUG_PLACEHOLDER|${DEFAULT_SLUG}|g" dist/404.html

      - name: Inject version picker
        run: |
          python build_scripts/inject_version_picker.py \
            --site-dir dist \
            --base "${DOCS_BASE}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
