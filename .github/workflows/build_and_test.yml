# Builds the pyrit environment and runs all tests and pre-commit hooks

name: build_and_test

env:
  PRE_COMMIT_PYTHON_VERSION: '3.11'

on:
  push:
    branches:
      - "main"
      - "releases/v*"
  pull_request:
    branches:
      - "main"
      - "releases/**"
  merge_group:
  workflow_dispatch:

concurrency:
  # PR numbers distinguish same-named branches from different forks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlserver-migrations:
    name: SQL Server migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          # Disposable authentication for this job's container only.
          MSSQL_SA_PASSWORD: Pyrit_CI_only!4829
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pyrit_CI_only!4829' -C -b -l 3 -Q 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
          --health-start-period=10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install ODBC driver and Python dependencies
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          uv sync --frozen
      - name: Exercise SQL Server migrations
        env:
          RUN_ALL_TESTS: 'true'
          PYRIT_TEST_SQLSERVER_URL: mssql+pyodbc://sa:Pyrit_CI_only!4829@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
        run: uv run --frozen pytest tests/integration/memory/test_sqlserver_migrations_integration.py -v --timeout=300
      - name: SQL Server diagnostics
        if: failure()
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker inspect "$SQLSERVER_CONTAINER"
          docker logs "$SQLSERVER_CONTAINER"

  pre-commit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so pre-commit hooks (notably
          # enforce_alembic_revision_immutability) can compute merge-bases and
          # diff ranges against origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PRE_COMMIT_PYTHON_VERSION }}

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # pre-commit-uv rebuilds hook environments that virtualenv created, so the
          # "uv" prefix keeps older caches from being restored and rebuilt on every run.
          key: pre-commit-uv-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-uv-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dev extras
        run: uv sync --extra all

      - name: disk space
        shell: bash
        run: df -all -h

      - name: Run pre-commit (all files)
        # Always lint the ENTIRE repository on every event (pull_request,
        # merge_group, push to main, workflow_dispatch). Running --all-files on
        # PRs -- rather than only the files changed since origin/main -- ensures
        # latent violations in untouched files, including the tests/integration,
        # tests/partner_integration, and tests/end_to_end tiers, are caught before
        # merge instead of only on the post-merge run against main.
        shell: bash
        run: |
          git fetch origin main
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF"
          fi
          uv run pre-commit run --all-files

      - name: Check production and unit typing
        if: matrix.os == 'ubuntu-latest'
        run: make ty

  # Main job runs only if pre-commit succeeded
  main-job:
    strategy:
      fail-fast: false
      matrix:
        # disable macOS unit tests in merge queue, enable otherwise
        os: ${{ fromJSON(github.event_name == 'merge_group' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python: ["3.11", "3.12", "3.13", "3.14"]
        package_name: ["pyrit"]
        package_extras: ["dev", "dev_all"]
    runs-on: ${{ matrix.os }}
    # EnricoMi/publish-unit-test-result-action@v2 requires the following permissions
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up Python
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      # Install PyRIT with optional extras
      - name: Install PyRIT with uv
        # If the matrix extras is 'dev_all', then we install all extras
        # otherwise just install the default dependencies
        shell: bash
        run: |
          if [ "${{ matrix.package_extras }}" = "dev_all" ]; then
            uv sync --extra all
          else
            uv sync
          fi

      - name: Run unit tests
        run: make unit-test-junit

      - name: Upload JUnit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: junit-results-${{ runner.os }}-${{ matrix.python }}-${{ matrix.package_extras }}
          path: junit/test-results.xml
          if-no-files-found: ignore

      - name: Publish Pytest Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: (success() || failure()) && runner.os == 'Linux'
        with:
          check_name: Pytest (${{ matrix.python }}, ${{ matrix.package_extras }})
          files: '**/test-*.xml'
