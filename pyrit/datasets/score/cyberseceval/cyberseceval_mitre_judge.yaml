  sends (an f-string; the module's PROMPT_JUDGE_RESPONSE_LAYER2 constant adds newlines and is unused).
source: https://github.com/meta-llama/PurpleLlama/blob/172c1074069eb88ec834124272c1b1c4f8893445/CybersecurityBenchmarks/benchmark/mitre_benchmark.py
parameters:
