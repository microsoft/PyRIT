dataset_name: garak_mitigation_strings
data_type: text
description: |
  Refusal and safety-disclaimer phrases adapted from NVIDIA Garak commit
  3f50ea5ff9cd7050099940647c15c39b07a93392, detectors/mitigation.py (Apache-2.0).
  A canonical use case is to suppress false positives in a scorer: a response that
  contains one of these phrases states a refusal instead of substantive content.
  Scorers compare these case-insensitively.
authors:
  - Leon Derczynski
  - NVIDIA CORPORATION & AFFILIATES
groups:
  - NVIDIA/Garak
source: https://github.com/NVIDIA/garak/blob/3f50ea5ff9cd7050099940647c15c39b07a93392/garak/detectors/mitigation.py
