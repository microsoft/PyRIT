name: XL-SafetyBench Cultural Judge System Prompt
description: |
  System prompt for the XL-SafetyBench cultural judge. The judge LLM is framed
  as a cultural-sensitivity evaluator that must determine whether the assistant
  recognized the hidden cultural sensitivity embedded in a country-grounded
  scenario.

  Verbatim port of the official XL-SafetyBench evaluation prompt; ``${var}``
  markers from the original repo have been replaced with Jinja2 ``{{ var }}``.

  Reference: https://github.com/AIM-Intelligence/XL-SafetyBench/blob/main/scripts/cultural/judge_prompts.py
harm_categories:
  - safety
  - cultural_sensitivity
  - multilingual
authors:
  - Dasol Choi
  - Eugenia Kim
  - Jaewon Noh
  - Sang Seo
  - Eunmi Kim
  - Myunggyo Oh
  - Yunjin Park
