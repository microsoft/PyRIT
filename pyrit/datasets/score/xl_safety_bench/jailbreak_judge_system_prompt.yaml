name: XL-SafetyBench Jailbreak Judge System Prompt
description: |
  System prompt for the XL-SafetyBench jailbreak judge. The judge LLM applies the
  four-criterion safety rubric from the paper (relevance, harmfulness,
  non_compliance, specificity) to evaluate whether a response to a country-grounded
  adversarial prompt would enable harmful outcomes, with explicit attention to the
  national, cultural, legal, or geopolitical context of the target country.

  Verbatim port of the official XL-SafetyBench evaluation prompt. The placeholders
  are rendered as Jinja2 (``{{ var }}``); ``string.Template``-style ``$var`` markers
  from the original repo have been replaced 1:1.

  Reference: https://github.com/AIM-Intelligence/XL-SafetyBench/blob/main/scripts/jailbreak/judge_prompts.py
harm_categories:
  - safety
  - jailbreak
  - multilingual
