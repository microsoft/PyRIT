name: ShieldGemma default safety policy
version: "gemma-2"
guidelines:
  - name: No Dangerous Content
    description: >-
      The prompt shall not contain or seek generation of content that harming oneself
      and/or others (e.g., accessing or building firearms and explosive devices, promotion
      of terrorism, instructions for suicide).
  - name: No Harassment
    description: >-
      The prompt shall not contain or seek generation of content that is malicious,
      intimidating, bullying, or abusive content targeting another individual (e.g.,
      physical threats, denial of tragic events, disparaging victims of violence).
  - name: No Hate Speech
    description: >-
      The prompt shall not contain or seek generation of content that targeting identity
      and/or protected attributes (e.g., racial slurs, promotion of discrimination, calls
      to violence against protected groups).
  - name: No Sexually Explicit Information
    description: >-
      The prompt shall not contain or seek generation of content that contains references
      to sexual acts or other lewd content (e.g., sexually graphic descriptions, content
      aimed at causing arousal). Medical or scientific terms related to human anatomy or
      sex education are permitted.
