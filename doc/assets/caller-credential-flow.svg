<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Personal targets: shared configuration, each caller's own credential</title>
  <desc id="description">An operator creates a target or copies an existing target with requires_caller_credential enabled. Each caller submits their own token to a process-memory store keyed by caller principal and target credential ID. Authentication scopes prompts and background work to the caller. Before each provider request, the target looks up that caller's current token. A missing token raises CallerCredentialRequiredError without falling back to another user or server credentials. Shared targets remain unchanged.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8a4c"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b53f3f"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#ffffff"/>
  <text x="24" y="48" font-size="30" font-weight="700" fill="#1d2733">Personal targets: shared configuration, each caller's own credential</text>
  <text x="24" y="82" font-size="19" fill="#5b6675">Opt in with requires_caller_credential: true. Ordinary shared targets keep their existing authentication.</text>

  <rect x="24" y="112" width="350" height="806" rx="14" fill="#f3f5f8" stroke="#c9d1dc" stroke-width="2"/>
  <text x="44" y="144" font-size="15" font-weight="700" fill="#5b6675" letter-spacing="1">OPERATOR / CLI</text>
  <rect x="44" y="166" width="310" height="126" rx="12" fill="#ffffff" stroke="#6b3fb3" stroke-width="2"/>
  <text x="62" y="198" font-size="21" font-weight="700" fill="#1d2733">1. Create a personal target</text>
  <text x="62" y="230" font-size="17" fill="#3c4a5c">Configure from scratch, or copy</text>
  <text x="62" y="254" font-size="17" fill="#3c4a5c">an initializer's existing target.</text>
  <text x="62" y="278" font-size="15" fill="#6b3fb3">POST /api/targets</text>

  <rect x="44" y="346" width="310" height="196" rx="12" fill="#ffffff" stroke="#1e8a4c" stroke-width="2"/>
  <text x="62" y="380" font-size="21" font-weight="700" fill="#1d2733">2. Set your own token</text>
  <text x="62" y="414" font-size="17" fill="#3c4a5c">Hidden prompt, environment,</text>
  <text x="62" y="438" font-size="17" fill="#3c4a5c">or the Anthropic ant CLI.</text>
  <text x="62" y="474" font-size="16" fill="#1e5d36">add-personal-target</text>
  <text x="62" y="498" font-size="16" fill="#1e5d36">set-target-credential</text>
  <text x="62" y="524" font-size="15" fill="#5b6675">Remote credential submission: HTTPS.</text>

  <rect x="44" y="598" width="310" height="124" rx="12" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/>
  <text x="62" y="632" font-size="21" font-weight="700" fill="#1d2733">3. Send a prompt</text>
  <text x="62" y="666" font-size="17" fill="#3c4a5c">Select the personal target in</text>
  <text x="62" y="690" font-size="17" fill="#3c4a5c">a chat, attack, or scenario.</text>

  <text x="44" y="782" font-size="18" font-weight="700" fill="#1d2733">Shared does not mean shared keys</text>
  <text x="44" y="816" font-size="17" fill="#3c4a5c">Other callers can see this target.</text>
  <text x="44" y="842" font-size="17" fill="#3c4a5c">Each must set their own credential</text>
  <text x="44" y="868" font-size="17" fill="#3c4a5c">before using it.</text>

  <rect x="406" y="112" width="958" height="806" rx="14" fill="#eef4fb" stroke="#b9cde6" stroke-width="2"/>
  <text x="428" y="144" font-size="15" font-weight="700" fill="#5b6675" letter-spacing="1">COPYRIT / PYRIT BACKEND</text>
  <rect x="428" y="166" width="914" height="126" rx="12" fill="#fdf6e3" stroke="#d4b25a" stroke-width="2"/>
  <text x="450" y="200" font-size="23" font-weight="700" fill="#1d2733">Registered personal target: configuration only, no stored key</text>
  <text x="450" y="234" font-size="18" fill="#3c4a5c">Endpoint + model + settings + caller-aware token provider.</text>
  <text x="450" y="264" font-size="17" fill="#3c4a5c">A personal copy replaces the source's authentication; the original target stays unchanged.</text>

  <rect x="428" y="346" width="424" height="196" rx="12" fill="#eef8f1" stroke="#1e8a4c" stroke-width="2"/>
  <text x="450" y="380" font-size="22" font-weight="700" fill="#1d2733">Process-memory credential store</text>
  <text x="450" y="412" font-size="17" fill="#3c4a5c">Key: (caller principal, target credential ID)</text>
  <text x="450" y="450" font-size="18" fill="#1e5d36">Caller A + my-target  =  A's token</text>
  <text x="450" y="480" font-size="18" fill="#b53f3f">Caller B + my-target  =  not set yet</text>
  <text x="450" y="518" font-size="16" fill="#5b6675">PUT /api/targets/{id}/credentials</text>

  <rect x="888" y="346" width="454" height="196" rx="12" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/>
  <text x="910" y="380" font-size="22" font-weight="700" fill="#1d2733">Authenticated caller context</text>
  <text x="910" y="416" font-size="18" fill="#3c4a5c">Entra: tenant + object ID.</text>
  <text x="910" y="444" font-size="18" fill="#3c4a5c">Local mode: one loopback caller.</text>
  <text x="910" y="482" font-size="17" fill="#3c4a5c">Background work and queued scenarios</text>
  <text x="910" y="508" font-size="17" fill="#3c4a5c">keep the caller who started them.</text>

  <rect x="428" y="598" width="914" height="124" rx="12" fill="#edf3fc" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="450" y="634" font-size="23" font-weight="700" fill="#1d2733">4. Before every provider request, resolve the current caller's token</text>
  <text x="450" y="668" font-size="18" fill="#3c4a5c">The target's token provider reads caller context and looks up only that caller + target.</text>
  <text x="450" y="698" font-size="17" fill="#3c4a5c">Replacing a token changes the next request, including requests from already-running work.</text>

  <rect x="428" y="778" width="424" height="112" rx="12" fill="#fdf0f0" stroke="#b53f3f" stroke-width="2"/>
  <text x="450" y="810" font-size="20" font-weight="700" fill="#b53f3f">Missing caller or token: stop</text>
  <text x="450" y="840" font-size="17" font-family="Consolas, 'Courier New', monospace" fill="#1d2733">CallerCredentialRequiredError</text>
  <text x="450" y="870" font-size="17" fill="#3c4a5c">No other user's token. No server fallback.</text>
  <rect x="888" y="778" width="454" height="112" rx="12" fill="#eef8f1" stroke="#1e8a4c" stroke-width="2"/>
  <text x="910" y="810" font-size="20" font-weight="700" fill="#1e5d36">Token found: send as this caller</text>
  <text x="910" y="842" font-size="17" fill="#3c4a5c">Caller A uses A's token.</text>
  <text x="910" y="868" font-size="17" fill="#3c4a5c">Caller B uses B's token once B sets it.</text>

  <rect x="1396" y="112" width="380" height="806" rx="14" fill="#fbf3ea" stroke="#e2b98f" stroke-width="2"/>
  <text x="1418" y="144" font-size="15" font-weight="700" fill="#5b6675" letter-spacing="1">MODEL PROVIDER</text>
  <rect x="1418" y="166" width="336" height="202" rx="12" fill="#fffdf6" stroke="#d4b25a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1438" y="202" font-size="21" font-weight="700" fill="#1d2733">Two separate credentials</text>
  <text x="1438" y="240" font-size="18" fill="#3c4a5c">Signing in to CoPyRIT identifies</text>
  <text x="1438" y="266" font-size="18" fill="#3c4a5c">the caller of the backend.</text>
  <text x="1438" y="306" font-size="18" fill="#3c4a5c">The personal target's token</text>
  <text x="1438" y="332" font-size="18" fill="#3c4a5c">authenticates to the provider.</text>
  <text x="1418" y="434" font-size="20" font-weight="700" fill="#1d2733">Who refreshes the token?</text>
  <text x="1418" y="470" font-size="18" fill="#3c4a5c">The caller obtains and submits it.</text>
  <text x="1418" y="510" font-size="18" fill="#3c4a5c">CLI --from-ant --keep-fresh</text>
  <text x="1418" y="536" font-size="18" fill="#3c4a5c">can re-read and re-send it.</text>
  <text x="1418" y="576" font-size="18" fill="#3c4a5c">The backend never acquires</text>
  <text x="1418" y="602" font-size="18" fill="#3c4a5c">or refreshes OAuth tokens.</text>
  <rect x="1418" y="778" width="336" height="112" rx="12" fill="#2b2f36"/>
  <text x="1438" y="814" font-size="23" font-weight="700" fill="#ffffff">Model endpoint</text>
  <text x="1438" y="848" font-size="18" fill="#d5dae1">Receives the request with</text>
  <text x="1438" y="874" font-size="18" fill="#d5dae1">this caller's key or access token.</text>

  <path d="M354,228 H422" stroke="#6b3fb3" stroke-width="3" fill="none" marker-end="url(#purple)"/>
  <path d="M354,444 H422" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <path d="M354,660 H422" stroke="#1f5fbf" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M868,292 V570 H900 V592" stroke="#6b3fb3" stroke-width="2.5" fill="none" marker-end="url(#purple)"/>
  <path d="M600,598 V548" stroke="#1f5fbf" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M744,542 V592" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <text x="508" y="578" font-size="15" fill="#1f5fbf">lookup</text>
  <text x="760" y="578" font-size="15" fill="#1e5d36">token</text>
  <path d="M1116,542 V592" stroke="#1f5fbf" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M640,722 V772" stroke="#b53f3f" stroke-width="3" fill="none" marker-end="url(#red)"/>
  <text x="656" y="755" font-size="16" fill="#b53f3f">missing</text>
  <path d="M1116,722 V772" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <text x="1132" y="755" font-size="16" fill="#1e5d36">found</text>
  <path d="M1342,834 H1412" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>

  <rect x="24" y="942" width="1752" height="134" rx="14" fill="#f6f2fb" stroke="#d6c8ea" stroke-width="2"/>
  <text x="46" y="976" font-size="21" font-weight="700" fill="#1d2733">Lifetime and boundaries</text>
  <text x="46" y="1010" font-size="18" fill="#3c4a5c">One backend worker and one replica. Credentials are memory-only and lost on restart or reinitialization; they are never returned or persisted.</text>
  <text x="46" y="1044" font-size="18" fill="#3c4a5c">Removing your credential affects only you. Deleting a target clears all its callers' credentials. Neither operation revokes a token at the provider.</text>
</svg>
