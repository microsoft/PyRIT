<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Personal targets: each caller uses their own token</title>
  <desc id="description">Setup creates or copies a personal target with shared settings and no stored token. Each caller submits a separate provider token to backend process memory. For every provider request, PyRIT identifies the caller and looks up their current token for that target. A found token authenticates the model request. A missing caller or token stops the request with CallerCredentialRequiredError, without falling back to server credentials or another user's token.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8a4c"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb3"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b53f3f"/></marker>
  </defs>
  <rect width="1800" height="950" fill="#ffffff"/>
  <text x="40" y="58" font-size="36" font-weight="700" fill="#1d2733">Personal targets: each caller uses their own token</text>
  <text x="40" y="100" font-size="23" fill="#5b6675">Shared target settings. Separate credentials. A fresh lookup before every provider request.</text>

  <text x="40" y="156" font-size="17" font-weight="700" fill="#5b6675" letter-spacing="1">SETUP</text>
  <rect x="40" y="180" width="660" height="170" rx="14" fill="#fdf6e3" stroke="#d4b25a" stroke-width="2"/>
  <text x="64" y="220" font-size="26" font-weight="700" fill="#1d2733">Create or copy a personal target</text>
  <text x="64" y="260" font-size="22" fill="#3c4a5c">Endpoint + model + settings. No token in the target.</text>
  <text x="64" y="304" font-size="21" font-family="Consolas, 'Courier New', monospace" fill="#6b3fb3">requires_caller_credential: true</text>

  <rect x="800" y="180" width="960" height="170" rx="14" fill="#eef8f1" stroke="#1e8a4c" stroke-width="2"/>
  <text x="824" y="220" font-size="26" font-weight="700" fill="#1d2733">Each caller sets a token for this target</text>
  <text x="824" y="254" font-size="22" fill="#3c4a5c">Submitted by CLI or API; kept in backend process memory.</text>
  <rect x="824" y="274" width="434" height="52" rx="9" fill="#ffffff" stroke="#1e8a4c"/>
  <text x="846" y="308" font-size="22" fill="#1e5d36">Caller A + target = A's token</text>
  <rect x="1282" y="274" width="454" height="52" rx="9" fill="#ffffff" stroke="#b53f3f"/>
  <text x="1304" y="308" font-size="22" fill="#b53f3f">Caller B + target = not set yet</text>

  <text x="40" y="444" font-size="17" font-weight="700" fill="#5b6675" letter-spacing="1">EVERY REQUEST</text>
  <rect x="410" y="414" width="930" height="454" rx="14" fill="#eef4fb" stroke="#b9cde6" stroke-width="2"/>
  <text x="434" y="444" font-size="17" font-weight="700" fill="#5b6675" letter-spacing="1">COPYRIT / PYRIT BACKEND</text>

  <rect x="40" y="492" width="310" height="154" rx="12" fill="#f3f5f8" stroke="#8a99ad" stroke-width="2"/>
  <text x="64" y="534" font-size="26" font-weight="700" fill="#1d2733">1. Send a prompt</text>
  <text x="64" y="578" font-size="22" fill="#3c4a5c">Caller A or Caller B.</text>
  <text x="64" y="612" font-size="22" fill="#3c4a5c">Same personal target.</text>

  <rect x="440" y="492" width="350" height="154" rx="12" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/>
  <text x="464" y="534" font-size="26" font-weight="700" fill="#1d2733">2. Identify the caller</text>
  <text x="464" y="578" font-size="22" fill="#3c4a5c">Entra tenant + object ID.</text>
  <text x="464" y="612" font-size="22" fill="#3c4a5c">Local mode: one caller.</text>

  <rect x="850" y="492" width="460" height="154" rx="12" fill="#edf3fc" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="874" y="534" font-size="26" font-weight="700" fill="#1d2733">3. Look up their token</text>
  <text x="874" y="578" font-size="22" fill="#3c4a5c">Read only this caller + this target.</text>
  <text x="874" y="612" font-size="22" fill="#3c4a5c">Use the current value on every call.</text>

  <rect x="1410" y="492" width="350" height="154" rx="12" fill="#2b2f36"/>
  <text x="1434" y="534" font-size="26" font-weight="700" fill="#ffffff">4. Call the model</text>
  <text x="1434" y="578" font-size="22" fill="#d5dae1">A uses A's token.</text>
  <text x="1434" y="612" font-size="22" fill="#d5dae1">B uses B's, once set.</text>

  <rect x="850" y="726" width="460" height="122" rx="12" fill="#fdf0f0" stroke="#b53f3f" stroke-width="2"/>
  <text x="874" y="762" font-size="25" font-weight="700" fill="#b53f3f">No caller or token? Stop.</text>
  <text x="874" y="798" font-size="21" font-family="Consolas, 'Courier New', monospace" fill="#1d2733">CallerCredentialRequiredError</text>
  <text x="874" y="830" font-size="21" fill="#3c4a5c">Never use server or another user's token.</text>

  <path d="M700,264 H740 V462 H922 V486" stroke="#6b3fb3" stroke-width="2.5" fill="none" marker-end="url(#purple)"/>
  <text x="758" y="450" font-size="18" fill="#6b3fb3">settings</text>
  <path d="M1080,350 V486" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <text x="1098" y="398" font-size="18" fill="#1e5d36">read caller's token</text>
  <path d="M350,568 H434" stroke="#1f5fbf" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M790,568 H844" stroke="#1f5fbf" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M1310,568 H1404" stroke="#1e8a4c" stroke-width="3" fill="none" marker-end="url(#green)"/>
  <text x="1344" y="550" font-size="19" font-weight="700" fill="#1e5d36">found</text>
  <path d="M1080,646 V720" stroke="#b53f3f" stroke-width="3" fill="none" marker-end="url(#red)"/>
  <text x="1098" y="694" font-size="19" font-weight="700" fill="#b53f3f">missing</text>

  <text x="40" y="920" font-size="21" fill="#5b6675">Personal targets only. Ordinary shared targets keep their existing authentication.</text>
</svg>
