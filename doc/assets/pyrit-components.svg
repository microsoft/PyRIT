<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="986" viewBox="0 0 1840 986" role="img" aria-labelledby="title description">
  <title id="title">PyRIT architecture</title>
  <desc id="description">Surfaces (Python and notebooks, or the CLI and GUI through the backend REST API) run scenarios and attacks and keep domain logic in the library. Scenarios package the complete run: dataset objectives, the objective target, and scorers are run inputs. Inside, attack techniques package an attack with its converters, attack prompts, and adversarial or helper targets. In the shared library, the registry instantiates components and memory stores conversations, scores, and results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0065ad"/>
    </marker>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; }
      .heading { font-size: 35px; font-weight: 700; fill: #142f49; }
      .body { font-size: 26px; fill: #142f49; }
      .note { font-size: 23px; fill: #4d6074; }
      .label { font-size: 23px; font-weight: 700; fill: #0065ad; }
      .card { fill: #ffffff; stroke: #91b9d3; stroke-width: 2; }
      .group { fill: #f2f7fb; stroke: #91b9d3; stroke-width: 2; }
      .link { fill: none; stroke: #0065ad; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1840" height="986" fill="#ffffff"/>

  <rect x="24" y="24" width="1792" height="106" class="group"/>
  <text x="56" y="71" class="heading">Surfaces</text>
  <text x="56" y="107" class="body">Python and notebooks, or the CLI and GUI through the backend REST API.</text>
  <text x="1784" y="107" text-anchor="end" class="label">Thin: logic lives in the library</text>

  <path d="M666 132v44" class="link"/>
  <text x="684" y="163" class="label">Run scenarios and attacks</text>

  <rect x="24" y="178" width="1284" height="784" class="group"/>
  <text x="56" y="231" class="heading">Scenarios</text>
  <text x="56" y="267" class="body">Select datasets, techniques, and scorers; manage parallel runs.</text>

  <rect x="56" y="364" width="944" height="426" fill="#d5e8f4" stroke="#0065ad" stroke-width="2.5"/>
  <text x="566" y="411" class="heading">Attack techniques</text>
  <text x="566" y="446" class="body">Package a named, reusable attack.</text>

  <rect x="104" y="296" width="420" height="156" class="card"/>
  <path d="M104 364h420" stroke="#0065ad" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="126" y="329" class="heading">Datasets</text>
  <text x="126" y="355" class="note">Objectives for the run</text>
  <text x="126" y="402" class="body">Attack prompts / templates</text>
  <text x="126" y="433" class="note">Selected by the technique</text>

  <path d="M314 452v48" class="link"/>
  <rect x="104" y="502" width="350" height="145" class="card"/>
  <text x="126" y="545" class="heading">Converters</text>
  <text x="126" y="583" class="body">Transform prompts.</text>
  <text x="126" y="618" class="body">Combine in a sequence.</text>

  <path d="M454 574h72" class="link"/>
  <rect x="528" y="502" width="350" height="145" class="card"/>
  <text x="550" y="545" class="heading">Attacks</text>
  <text x="550" y="583" class="body">Manage conversations.</text>
  <text x="550" y="618" class="body">Decide the next step.</text>

  <path d="M1022 574h-142" class="link"/>
  <rect x="1024" y="502" width="260" height="145" class="card"/>
  <text x="1046" y="545" class="heading">Scorers</text>
  <text x="1046" y="583" class="body">Check outcomes.</text>
  <text x="1046" y="618" class="body">Guide decisions.</text>

  <path d="M703 649v42" class="link"/>
  <rect x="528" y="693" width="448" height="192" class="card"/>
  <path d="M528 790h448" stroke="#0065ad" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="550" y="732" class="heading">Targets</text>
  <text x="550" y="768" class="body">Adversarial / helper models</text>
  <text x="550" y="826" class="body">Objective target:</text>
  <text x="550" y="860" class="body">the system under test</text>

  <text x="104" y="836" class="label">BOXES SHOW PACKAGING</text>
  <text x="104" y="869" class="note">Arrows show component use.</text>
  <text x="104" y="906" class="note">Dashed lines split run inputs</text>
  <text x="104" y="938" class="note">from technique configuration.</text>

  <rect x="1480" y="178" width="336" height="784" class="group"/>
  <text x="1504" y="231" class="heading">Shared library</text>

  <rect x="1504" y="296" width="288" height="218" class="card"/>
  <text x="1526" y="339" class="heading">Registry</text>
  <text x="1526" y="377" class="body">Build components</text>
  <text x="1526" y="412" class="body">from user input.</text>
  <text x="1526" y="450" class="body">Store reusable</text>
  <text x="1526" y="485" class="body">instances.</text>
  <path d="M1502 405h-192" class="link"/>
  <text x="1394" y="388" text-anchor="middle" class="label">Instantiates</text>

  <rect x="1504" y="546" width="288" height="183" class="card"/>
  <text x="1526" y="589" class="heading">Memory</text>
  <text x="1526" y="627" class="body">Store conversations,</text>
  <text x="1526" y="662" class="body">scores, and results.</text>
  <text x="1526" y="700" class="body">The shared record.</text>
  <path d="M1502 637h-192" class="link" marker-start="url(#arrow)"/>
  <text x="1394" y="620" text-anchor="middle" class="label">Read / write</text>

  <text x="1504" y="836" class="note">Also: models, normalizers,</text>
  <text x="1504" y="869" class="note">output, analytics, setup.</text>
</svg>
