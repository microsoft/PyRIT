# Isolated, provider-free browser acceptance environment.
memory_db_type: in_memory
env_files: []
env_akv_ref: []
initializers:
  - technique
  - name: load_default_datasets
    args:
      dataset_names:
        - jailbreak_templates
initialization_scripts:
  - tests/end_to_end/browser_initializer.py
operation: browser_proposed
# A key users can pick by name for OpenAI targets. The value set in playwright.config.ts is never sent anywhere.
server_credentials:
  - name: e2e_listed
    env_var: PYRIT_E2E_LISTED_KEY
    endpoint: https://e2e-listed.example.test/v1
