# CI/CD pipeline for the CoPyRIT GUI.
#
# App-only test deployment is the default. Infrastructure reconciliation is
# explicit and leaves the running app unchanged before deploying new code.

trigger: none
pr: none

schedules:
  - cron: '0 15 * * *'
    displayName: 'Morning test deployment (7 AM PST / 8 AM PDT)'
    branches:
      include:
        - main
    # Internal configuration can change without a public PyRIT commit.
    always: true

parameters:
  - name: deployInfra
    displayName: 'Deploy Infrastructure'
    type: boolean
    default: false
  - name: deployToTest
    displayName: 'Deploy to test (clear only to deploy straight to production)'
    type: boolean
    default: true
  - name: deployToProd
    displayName: 'Deploy to production'
    type: boolean
    default: false
  - name: useInternalDeploymentProfile
    displayName: 'Use an internal deployment profile'
    type: boolean
    default: false
  - name: profileRun
    displayName: 'Private CI run (latest successful main run, or an exact run ID)'
    type: string
    default: latest
  - name: pyritVersion
    displayName: 'PyRIT version (main = queued source, or exact X.Y.Z PyPI release)'
    type: string
    default: main

variables:
  azureServiceConnection: 'copyrit-gui-azure'

stages:
  - stage: ValidateInputs
    displayName: 'Validate Inputs'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: ValidateSource
        displayName: 'Validate source and profile selection'
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              if [[ ( "$USE_PROFILE" == [Tt]rue || "$PYRIT_VERSION" != main ) && \
                ( "$BUILD_REPOSITORY_NAME" != microsoft/PyRIT || "$BUILD_SOURCEBRANCH" != refs/heads/main || "$DEPLOY_TO_TEST" != [Tt]rue ) ]]; then
                echo "##vso[task.logissue type=error]Private profiles and PyPI releases require microsoft/PyRIT main and a test deployment"
                exit 1
              fi
              if [[ "$DEPLOY_TO_PROD" == [Tt]rue && ( "$BUILD_REPOSITORY_NAME" != microsoft/PyRIT || \
                ( "$BUILD_SOURCEBRANCH" != refs/heads/main && "$BUILD_SOURCEBRANCH" != refs/heads/releases/v* ) ) ]]; then
                echo "##vso[task.logissue type=error]Production requires microsoft/PyRIT main or a releases/v* branch"
                exit 1
              fi
              if [[ "$DEPLOY_TO_TEST" != [Tt]rue && "$DEPLOY_TO_PROD" != [Tt]rue ]]; then
                echo "##vso[task.logissue type=error]Skipping the test deployment requires a production deployment"
                exit 1
              fi
              if [[ "$PYRIT_VERSION" != main && ! "$PYRIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                || [[ "$PROFILE_RUN" != latest && ! "$PROFILE_RUN" =~ ^[1-9][0-9]*$ ]]; then
                echo "##vso[task.logissue type=error]Expected main or X.Y.Z, and latest or a positive CI run ID"
                exit 1
              fi
              if [[ "$USE_PROFILE" == [Tt]rue && "$PYRIT_VERSION" != main && "$PROFILE_RUN" == latest ]]; then
                echo "##vso[task.logissue type=error]A release with a private profile requires an explicit profileRun"
                exit 1
              fi
            displayName: 'Validate deployment inputs'
            env:
              DEPLOY_TO_PROD: ${{ parameters.deployToProd }}
              DEPLOY_TO_TEST: ${{ parameters.deployToTest }}
              USE_PROFILE: ${{ parameters.useInternalDeploymentProfile }}
              PYRIT_VERSION: ${{ parameters.pyritVersion }}
              PROFILE_RUN: ${{ parameters.profileRun }}

  - stage: Build
    displayName: 'Build and Push Image'
    dependsOn: ValidateInputs
    variables:
      - group: copyrit-gui-common
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and pin deployment image'
        steps:
          - checkout: self
            fetchDepth: 1
            path: s
          - ${{ if parameters.useInternalDeploymentProfile }}:
              - bash: python3 infra/pipelines/resolve_profile_run.py
                name: ResolveProfile
                displayName: 'Select a successful protected-main private CI run'
                env:
                  PROFILE_DEFINITION: $(deploymentProfilePipelineId)
                  PROFILE_RUN: ${{ parameters.profileRun }}
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              - task: DownloadPipelineArtifact@2
                displayName: 'Download only the selected deployment-profile'
                inputs:
                  buildType: specific
                  project: $(System.TeamProjectId)
                  definition: $(deploymentProfilePipelineId)
                  buildVersionToDownload: specific
                  pipelineId: $(ResolveProfile.runId)
                  artifactName: deployment-profile
                  targetPath: $(Agent.TempDirectory)/deployment-profile

          - bash: |
              set -euo pipefail
              df -h /
              docker system df
              docker system prune --all --force
              df -h /
            displayName: 'Reclaim Docker disk space before build'

          - task: AzureCLI@2
            name: BuildImage
            displayName: 'Build and push Docker image'
            env:
              PYRIT_ACR_NAME: $(acrName)
              PYRIT_ACR_LOGIN_SERVER: $(acrLoginServer)
              PYRIT_IMAGE_NAME: $(imageName)
              PYRIT_SOURCE_VERSION: $(Build.SourceVersion)
              PYRIT_VERSION: ${{ parameters.pyritVersion }}
              USE_PROFILE: ${{ parameters.useInternalDeploymentProfile }}
              ${{ if parameters.useInternalDeploymentProfile }}:
                PROFILE_DIRECTORY: $(Agent.TempDirectory)/deployment-profile
                PROFILE_RUN_ID: $(ResolveProfile.runId)
                PROFILE_COMMIT: $(ResolveProfile.commit)
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'scriptPath'
              scriptPath: '$(Build.SourcesDirectory)/infra/pipelines/build_image.sh'

          # The hosted agent is disposable; deployment pulls the pushed digest from ACR.
          # Release local images and build cache before injected post-job scanners run.
          - bash: |
              set -euo pipefail
              df -h /
              docker system df
              docker system prune --all --force
              df -h /
            displayName: 'Reclaim Docker disk space after build'
            condition: always()

  - template: infra/pipelines/deploy-stage.yml
    parameters:
      stageName: DeployTestInfra
      displayName: 'Deploy test infrastructure'
      deploymentName: DeployInfrastructure
      dependsOn:
        - Build
      slot: test
      phase: infra
      condition: >-
        and(succeeded(),
            eq('${{ parameters.deployToTest }}', 'true'),
            eq('${{ parameters.deployInfra }}', 'true'))

  - template: infra/pipelines/deploy-stage.yml
    parameters:
      stageName: DeployTest
      displayName: 'Deploy app to Test'
      deploymentName: DeployToTest
      dependsOn:
        - Build
        - DeployTestInfra
      slot: test
      phase: app
      useInternalDeploymentProfile: ${{ parameters.useInternalDeploymentProfile }}
      condition: >-
        and(not(canceled()),
            eq('${{ parameters.deployToTest }}', 'true'),
            in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'),
            or(in(dependencies.DeployTestInfra.result, 'Succeeded', 'SucceededWithIssues'),
               and(eq('${{ parameters.deployInfra }}', 'false'),
                   eq(dependencies.DeployTestInfra.result, 'Skipped'))))

  - stage: ApproveProd
    displayName: 'Approve Production Deployment'
    dependsOn:
      - Build
      - DeployTest
    condition: >-
      and(not(canceled()),
          eq('${{ parameters.deployToProd }}', 'true'),
          or(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
             startsWith(variables['Build.SourceBranch'], 'refs/heads/releases/v')),
          in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'),
          or(in(dependencies.DeployTest.result, 'Succeeded', 'SucceededWithIssues'),
             and(eq('${{ parameters.deployToTest }}', 'false'),
                 eq(dependencies.DeployTest.result, 'Skipped'))))
    variables:
      - group: copyrit-gui-prod
    jobs:
      - job: ValidateProdConfiguration
        displayName: 'Validate production authorization configuration'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              if [[ -z "${PROD_APPROVERS:-}" || "$PROD_APPROVERS" == '$('* ]]; then
                echo "##vso[task.logissue type=error]copyrit-gui-prod must define prodApprovers before production deployment"
                exit 1
              fi
            displayName: 'Validate production approvers'
            env:
              PROD_APPROVERS: $(prodApprovers)

      - job: WaitForProdApproval
        displayName: 'Validate production readiness'
        dependsOn: ValidateProdConfiguration
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: '$(prodApprovers)'
              approvers: '$(prodApprovers)'
              allowApproversToApproveTheirOwnRuns: false
              instructions: |
                Test deployment requested: ${{ parameters.deployToTest }}. If it ran, confirm test is healthy.
                Confirm Entra and backend group authorization work, and the static test egress IP is allow-listed.
                Approval checks the production database schema. If it is not current and this image can upgrade it,
                deployment stops the production app, runs the migration, and then deploys the production app.
                Infrastructure deployment requested: ${{ parameters.deployInfra }}.
                App deployment reconciles application configuration and preserves
                the existing public/private access mode.
                If infrastructure is requested, approve the production Private Link
                cutover and configuration changes before the new code is deployed.
              onTimeout: reject

  - template: infra/pipelines/deploy-stage.yml
    parameters:
      stageName: DeployProdInfra
      displayName: 'Deploy prod infrastructure'
      deploymentName: DeployInfrastructure
      dependsOn:
        - ApproveProd
      slot: prod
      phase: infra
      condition: and(succeeded(), eq('${{ parameters.deployInfra }}', 'true'))

  - template: infra/pipelines/deploy-stage.yml
    parameters:
      stageName: DeployProd
      displayName: 'Deploy app to Production'
      deploymentName: DeployToProd
      dependsOn:
        - ApproveProd
        - Build
        - DeployProdInfra
      slot: prod
      phase: app
      useInternalDeploymentProfile: ${{ parameters.useInternalDeploymentProfile }}
      condition: >-
        and(not(canceled()),
            in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'),
            in(dependencies.ApproveProd.result, 'Succeeded', 'SucceededWithIssues'),
            or(in(dependencies.DeployProdInfra.result, 'Succeeded', 'SucceededWithIssues'),
               and(eq('${{ parameters.deployInfra }}', 'false'),
                   eq(dependencies.DeployProdInfra.result, 'Skipped'))))
