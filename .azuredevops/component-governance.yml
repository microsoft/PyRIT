# Run Component Governance to register all dependencies.

trigger:
  - main

# There are additional PR triggers for this that are configurable in ADO.

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: ComponentGovernanceComponentDetection@0
    displayName: Detect components

  - task: notice@0
    displayName: Generate NOTICE file
    inputs:
      outputfile: $(System.DefaultWorkingDirectory)/obj/NOTICE
      outputformat: text

  - publish: $(System.DefaultWorkingDirectory)/obj/NOTICE
    artifact: NOTICE
    displayName: Publish generated NOTICE

  - bash: |
      checked_in="$(System.DefaultWorkingDirectory)/NOTICE.txt"
      generated="$(System.DefaultWorkingDirectory)/obj/NOTICE"

      if ! diff --brief --strip-trailing-cr "$checked_in" "$generated"; then
        echo "##vso[task.logissue type=error]NOTICE.txt is out of date. Download the NOTICE artifact from this run and replace NOTICE.txt."
        exit 1
      fi
    displayName: Verify NOTICE file is current
